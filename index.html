<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- ============================================================
     TODO 1：把下面 3 处「你的名字 / 一句话介绍」改成你自己的
     ============================================================ -->
<title>你的名字 · 个人主页</title>
<meta name="description" content="你的名字的个人主页 —— 一句话介绍你自己。" />

<!-- 社交分享卡片（分享到微信/微博时的预览） -->
<meta property="og:title" content="你的名字 · 个人主页" />
<meta property="og:description" content="一句话介绍你自己。" />
<meta property="og:type" content="website" />

<!-- 网页图标（用 emoji，无需图片文件；想换成就改这个字符） -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>" />

<style>
/* ========== 主题变量：改这里就能换整站配色 ========== */
:root {
  --bg:            #f6f7fb;
  --bg-glow-1:     rgba(99, 102, 241, .18);
  --bg-glow-2:     rgba(236, 72, 153, .14);
  --card:          #ffffff;
  --card-border:   rgba(15, 20, 40, .07);
  --text:          #16192a;
  --text-soft:     #5b6379;
  --text-faint:    #8b93a7;
  --chip-bg:       rgba(99, 102, 241, .09);
  --chip-text:     #4f46e5;
  --accent-1:      #6366f1;
  --accent-2:      #8b5cf6;
  --accent-3:      #ec4899;
  --shadow:        0 1px 2px rgba(16, 24, 40, .04), 0 12px 32px -8px rgba(16, 24, 40, .10);
  --shadow-hover:  0 2px 4px rgba(16, 24, 40, .05), 0 20px 44px -10px rgba(16, 24, 40, .16);
  --radius:        20px;
}

/* 深色主题 */
html[data-theme="dark"] {
  --bg:            #0e1016;
  --bg-glow-1:     rgba(99, 102, 241, .26);
  --bg-glow-2:     rgba(236, 72, 153, .18);
  --card:          #171a24;
  --card-border:   rgba(255, 255, 255, .08);
  --text:          #eceef5;
  --text-soft:     #a2aabf;
  --text-faint:    #767e94;
  --chip-bg:       rgba(129, 140, 248, .14);
  --chip-text:     #a5b4fc;
  --shadow:        0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px -8px rgba(0, 0, 0, .5);
  --shadow-hover:  0 2px 4px rgba(0, 0, 0, .35), 0 20px 44px -10px rgba(0, 0, 0, .6);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  color: var(--text);
  background: var(--bg);
  transition: background .35s ease, color .35s ease;
  -webkit-font-smoothing: antialiased;
  position: relative;
  overflow-x: hidden;
}

/* 背景氛围光斑 */
body::before,
body::after {
  content: "";
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
}
body::before {
  width: 480px; height: 480px;
  background: var(--bg-glow-1);
  top: -180px; left: -140px;
}
body::after {
  width: 420px; height: 420px;
  background: var(--bg-glow-2);
  bottom: -170px; right: -130px;
}

/* ========== 主卡片 ========== */
.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 620px;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 44px 40px 36px;
  animation: rise .7s cubic-bezier(.22, 1, .36, 1) both;
  transition: background .35s ease, border-color .35s ease, box-shadow .35s ease;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(22px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* 主题切换按钮 */
.theme-btn {
  position: absolute;
  top: 18px; right: 18px;
  width: 38px; height: 38px;
  display: grid;
  place-items: center;
  border: 1px solid var(--card-border);
  border-radius: 50%;
  background: transparent;
  color: var(--text-soft);
  cursor: pointer;
  transition: all .25s ease;
}
.theme-btn:hover {
  color: var(--text);
  background: var(--chip-bg);
  transform: rotate(15deg);
}
.theme-btn svg { width: 18px; height: 18px; }
html[data-theme="dark"] .icon-moon { display: none; }
html:not([data-theme="dark"]) .icon-sun { display: none; }

/* ========== 头部 ========== */
.header {
  display: flex;
  align-items: center;
  gap: 22px;
  margin-bottom: 24px;
}

/* 头像：默认是渐变 + 首字母；换照片见下方注释 */
.avatar {
  flex-shrink: 0;
  width: 88px; height: 88px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 34px;
  font-weight: 600;
  color: #fff;
  letter-spacing: 1px;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2) 55%, var(--accent-3));
  box-shadow: 0 8px 24px -6px rgba(99, 102, 241, .55);
  user-select: none;
}
/* 想用真实照片？把上面 .avatar 里的
   display: grid / background / font-size 保留无所谓，
   再加下面这行并把 url 换成你的图片路径即可：
   background-image: url('./avatar.jpg'); background-size: cover; background-position: center;
   同时把 HTML 里头像标签内的文字删掉。 */

.names { min-width: 0; }

h1 {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -.4px;
  line-height: 1.25;
}

.tagline {
  margin-top: 5px;
  font-size: 14.5px;
  color: var(--text-soft);
  line-height: 1.5;
}

/* 状态徽章 */
.status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 11px;
  padding: 4px 11px 4px 9px;
  border-radius: 999px;
  background: var(--chip-bg);
  font-size: 12.5px;
  color: var(--chip-text);
  font-weight: 500;
}
.status .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 0 0 rgba(34, 197, 94, .6);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 rgba(34, 197, 94, .55); }
  70%  { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
  100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}

/* ========== 简介 ========== */
.bio {
  font-size: 15px;
  line-height: 1.85;
  color: var(--text-soft);
  padding-bottom: 26px;
  border-bottom: 1px solid var(--card-border);
}
.bio strong { color: var(--text); font-weight: 600; }

/* ========== 分区标题 ========== */
.section { margin-top: 26px; }

.section-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1.3px;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 13px;
}

/* ========== 技能标签 ========== */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}
.chip {
  padding: 7px 14px;
  border-radius: 10px;
  background: var(--chip-bg);
  color: var(--chip-text);
  font-size: 13.5px;
  font-weight: 500;
  transition: transform .2s ease;
}
.chip:hover { transform: translateY(-2px); }

/* ========== 链接列表 ========== */
.links {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
  gap: 11px;
}
.link {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 13px 15px;
  border: 1px solid var(--card-border);
  border-radius: 14px;
  background: transparent;
  color: var(--text);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  transition: all .22s ease;
}
.link:hover {
  border-color: transparent;
  background: var(--chip-bg);
  color: var(--chip-text);
  transform: translateY(-3px);
  box-shadow: var(--shadow-hover);
}
.link svg {
  flex-shrink: 0;
  width: 18px; height: 18px;
  color: var(--text-faint);
  transition: color .22s ease;
}
.link:hover svg { color: var(--chip-text); }

/* ========== 页脚 ========== */
.footer {
  margin-top: 32px;
  padding-top: 20px;
  border-top: 1px solid var(--card-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 12.5px;
  color: var(--text-faint);
}
.footer a { color: inherit; text-decoration: none; }
.footer a:hover { color: var(--chip-text); }

/* ========== 手机适配 ========== */
@media (max-width: 560px) {
  body { padding: 20px 14px; align-items: flex-start; }
  .card { padding: 36px 22px 28px; border-radius: 18px; }
  .header { flex-direction: column; align-items: flex-start; gap: 16px; }
  .avatar { width: 74px; height: 74px; font-size: 28px; }
  h1 { font-size: 24px; }
  .links { grid-template-columns: 1fr; }
  .theme-btn { top: 14px; right: 14px; }
}

/* 尊重「减少动效」系统设置 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<script>
/* ---------- 主题切换（带记忆） ---------- */
(function () {
  var root = document.documentElement;
  var saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}

  var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  var theme = saved || (prefersDark ? 'dark' : 'light');
  root.setAttribute('data-theme', theme);

  document.getElementById('themeToggle').addEventListener('click', function () {
    theme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', theme);
    try { localStorage.setItem('theme', theme); } catch (e) {}
  });
})();

/* ---------- 页脚年份自动更新 ---------- */
document.getElementById('year').textContent = new Date().getFullYear();
</script>
