<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · Pelican Riding a Bicycle</title>
<meta name="description" content="纯 SVG + CSS 手工绘制的鹈鹕骑自行车 2D 循环动画，无任何外部依赖。" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚲</text></svg>" />

<style>
/* ═══════════════════════════════════════════════════════════
   配色令牌
   ═══════════════════════════════════════════════════════════ */
:root {
  --sky-0:    #060b14;
  --sky-1:    #0a1220;
  --sky-2:    #0e1b30;
  --city:     #101f36;
  --city-lit: rgba(34, 230, 255, .55);

  --cyan:     #22e6ff;
  --violet:   #a855f7;
  --magenta:  #ff2d95;
  --beak-0:   #ffcf6b;
  --beak-1:   #ff8c1a;
  --pouch:    rgba(255, 140, 60, .5);
  --body:     #0c2032;
  --helmet:   #ff2d95;
  --scarf:    #a855f7;

  --road:     rgba(34, 230, 255, .45);
  --speed:    1;                 /* ← JS 控制的核心变量：动画速度倍率 */
  --cycle:    1.6s;              /* 一个完整踩踏周期 */
  --mono:     ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans:     -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
              "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  padding: 32px 18px 40px;
  font-family: var(--sans);
  color: #dce8f7;
  background:
    radial-gradient(ellipse 70% 50% at 50% -10%, rgba(34, 230, 255, .13), transparent 68%),
    radial-gradient(ellipse 60% 45% at 85% 110%, rgba(168, 85, 247, .13), transparent 70%),
    #04070d;
  -webkit-font-smoothing: antialiased;
}

/* ═══════════ 标题 ═══════════ */
.head { text-align: center; }

.head h1 {
  font-size: clamp(19px, 3.6vw, 27px);
  font-weight: 800;
  letter-spacing: -.01em;
  background: linear-gradient(100deg, #ffffff 6%, var(--cyan) 46%, var(--violet) 80%, var(--magenta));
  -webkit-background-clip: text;
          background-clip: text;
  -webkit-text-fill-color: transparent;
  background-size: 220% 100%;
  animation: hueSlide 8s ease-in-out infinite alternate;
}
@keyframes hueSlide {
  from { background-position: 0% 50%; }
  to   { background-position: 100% 50%; }
}

.head p {
  margin-top: 8px;
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: #5d738f;
}

/* ═══════════ 舞台 ═══════════ */
.stage {
  position: relative;
  width: 100%;
  max-width: 860px;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid rgba(120, 200, 255, .16);
  box-shadow:
    0 30px 70px -30px rgba(34, 230, 255, .35),
    0 0 0 1px rgba(255, 255, 255, .02) inset;
  background: var(--sky-0);
  line-height: 0;
}

.stage svg {
  display: block;
  width: 100%;
  height: auto;
}

/* ═══════════ SVG 通用样式 ═══════════ */
.stroke      { fill: none; stroke: var(--cyan); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.stroke-thin { fill: none; stroke: var(--cyan); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
.tire        { fill: none; stroke: var(--cyan); stroke-width: 8; opacity: .95; }
.spoke       { stroke: rgba(34, 230, 255, .42); stroke-width: 3; stroke-linecap: round; }
.hub         { fill: var(--cyan); }
.chainring   { fill: none; stroke: rgba(34, 230, 255, .55); stroke-width: 4; }
.fill-neon   { fill: rgba(34, 230, 255, .12); stroke: var(--cyan); stroke-width: 6.5; stroke-linejoin: round; }

.body        { fill: var(--body); stroke: var(--cyan); stroke-width: 7; stroke-linejoin: round; }
.neck        { fill: none; stroke: var(--cyan); stroke-width: 21; stroke-linecap: round; }
.neck-inner  { fill: none; stroke: var(--body); stroke-width: 11; stroke-linecap: round; }
.beak        { fill: url(#beakGrad); stroke: var(--cyan); stroke-width: 5; stroke-linejoin: round; }
.pouch       { fill: var(--pouch); stroke: var(--cyan); stroke-width: 5; stroke-linejoin: round; }
.eye         { fill: #04101a; }
.glint       { fill: #d8fbff; }
.leg         { fill: none; stroke: var(--cyan); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
.leg-far     { opacity: .38; }

.helmet      { fill: var(--helmet); stroke: var(--cyan); stroke-width: 5; stroke-linejoin: round; opacity: .88; }
.scarf       { fill: none; stroke: var(--scarf); stroke-width: 13; stroke-linecap: round; opacity: .9; }
.scarf-tip   { fill: var(--scarf); opacity: .85; }

.road        { stroke: var(--road); stroke-width: 5; stroke-dasharray: 34 26; }
.road-faint  { stroke: rgba(34, 230, 255, .14); stroke-width: 3; stroke-dasharray: 16 40; }
.city        { fill: var(--city); }
.city-window { fill: var(--city-lit); opacity: .5; }
.speed-line  { stroke: rgba(34, 230, 255, .5); stroke-width: 4; stroke-linecap: round; }
.cloud       { fill: rgba(120, 200, 255, .07); }
.star        { fill: rgba(180, 230, 255, .55); }

/* ═══════════════════════════════════════════════════════════
   动画：全部用 calc(var(--cycle) / var(--speed)) 统一调速
   ═══════════════════════════════════════════════════════════ */
.rot { transform-box: view-box; }

/* —— 车轮：踩踏一圈约等于车轮转 2.6 圈 —— */
.wheel-back  { transform-origin: 300px 330px; animation: spin calc(var(--cycle) / 2.6 / var(--speed)) linear infinite; }
.wheel-front { transform-origin: 560px 330px; animation: spin calc(var(--cycle) / 2.6 / var(--speed)) linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* —— 曲柄 + 踏板 —— */
.crank { transform-origin: 430px 330px; animation: spin calc(var(--cycle) / var(--speed)) linear infinite; }

/* —— 骑行整体轻微起伏 —— */
.rider { transform-box: view-box; transform-origin: 430px 400px; animation: bob calc(var(--cycle) / var(--speed)) ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3.5px); }
}

/* —— 脖子点头 —— */
.head-group { transform-box: view-box; transform-origin: 420px 150px; animation: nod calc(var(--cycle) * 2 / var(--speed)) ease-in-out infinite; }
@keyframes nod {
  0%, 100% { transform: rotate(0deg); }
  50%      { transform: rotate(4deg); }
}

/* —— 翅膀扇动 —— */
.wing { transform-box: view-box; transform-origin: 300px 150px; animation: flap calc(var(--cycle) * 1.6 / var(--speed)) ease-in-out infinite; }
@keyframes flap {
  0%, 100% { transform: rotate(0deg) scaleY(1); }
  50%      { transform: rotate(-11deg) scaleY(.88); }
}

/* —— 双腿交替蹬踏 —— */
.leg-front { transform-box: view-box; transform-origin: 318px 208px; animation: pedalA calc(var(--cycle) / var(--speed)) linear infinite; }
.leg-back  { transform-box: view-box; transform-origin: 312px 208px; animation: pedalB calc(var(--cycle) / var(--speed)) linear infinite; }
@keyframes pedalA {
  0%, 100% { transform: rotate(-6deg); }
  50%      { transform: rotate(7deg); }
}
@keyframes pedalB {
  0%, 100% { transform: rotate(7deg); }
  50%      { transform: rotate(-6deg); }
}

/* —— 围巾飘动 —— */
.scarf-group { transform-box: view-box; transform-origin: 400px 118px; animation: scarfWave calc(var(--cycle) * .9 / var(--speed)) ease-in-out infinite; }
@keyframes scarfWave {
  0%, 100% { transform: rotate(-3deg) skewY(0deg); }
  50%      { transform: rotate(3deg) skewY(2.5deg); }
}

/* —— 眨眼 —— */
.eyelid { transform-box: view-box; transform-origin: 468px 82px; animation: blinkEye 4.6s ease-in-out infinite; }
@keyframes blinkEye {
  0%, 92%, 100% { transform: scaleY(1); }
  95%           { transform: scaleY(.08); }
}

/* —— 地面滚动（速度感）—— */
.road      { animation: dash calc(.75s / var(--speed)) linear infinite; }
.road-faint{ animation: dash calc(1.5s / var(--speed)) linear infinite; }
@keyframes dash { to { stroke-dashoffset: -60; } }

/* —— 速度线掠过 —— */
.speed-line { animation: whoosh calc(1.05s / var(--speed)) linear infinite; }
@keyframes whoosh {
  0%   { transform: translateX(0);      opacity: 0; }
  12%  { opacity: .8; }
  100% { transform: translateX(-190px); opacity: 0; }
}

/* —— 城市剪影缓慢横向滚动（视差）—— */
.city-band { animation: cityMove calc(26s / var(--speed)) linear infinite; }
@keyframes cityMove { to { transform: translateX(-800px); } }

/* —— 云 —— */
.cloud-band { animation: cityMove calc(46s / var(--speed)) linear infinite; }

/* —— 星空微闪 —— */
.star { animation: twinkle 3.4s ease-in-out infinite; }
.star:nth-child(2n) { animation-delay: 1.1s; }
.star:nth-child(3n) { animation-delay: 2.2s; }
@keyframes twinkle {
  0%, 100% { opacity: .25; }
  50%      { opacity: .9; }
}

/* 暂停状态：全局冻结所有动画 */
.stage.is-paused * { animation-play-state: paused !important; }

/* ═══════════ 控制面板 ═══════════ */
.panel {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px 22px;
  width: 100%;
  max-width: 860px;
  padding: 16px 20px;
  border-radius: 16px;
  border: 1px solid rgba(120, 200, 255, .14);
  background: linear-gradient(158deg, rgba(22, 32, 52, .7), rgba(9, 13, 22, .85));
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 17px;
  border: 1px solid rgba(120, 200, 255, .2);
  border-radius: 10px;
  background: rgba(120, 200, 255, .06);
  color: #dce8f7;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all .22s ease;
}
.btn:hover { border-color: rgba(34, 230, 255, .5); color: var(--cyan); }
.btn svg { width: 15px; height: 15px; }

.field { display: flex; align-items: center; gap: 11px; flex: 1; min-width: 210px; }
.field label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #5d738f;
  white-space: nowrap;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  height: 4px;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--cyan), var(--violet));
  outline: none;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 17px; height: 17px;
  border-radius: 50%;
  background: #eafcff;
  border: 2px solid var(--cyan);
  box-shadow: 0 0 14px rgba(34, 230, 255, .9);
  cursor: grab;
}
input[type="range"]::-moz-range-thumb {
  width: 15px; height: 15px;
  border-radius: 50%;
  background: #eafcff;
  border: 2px solid var(--cyan);
  box-shadow: 0 0 14px rgba(34, 230, 255, .9);
  cursor: grab;
}

.readout {
  display: flex;
  align-items: baseline;
  gap: 5px;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--cyan);
  min-width: 92px;
}
.readout b { font-size: 19px; font-weight: 700; }
.readout span { font-size: 11px; color: #5d738f; }

.note {
  width: 100%;
  max-width: 860px;
  font-size: 12.5px;
  line-height: 1.75;
  color: #5d738f;
  text-align: center;
}
.note code {
  font-family: var(--mono);
  font-size: 11.5px;
  padding: 2px 6px;
  border-radius: 5px;
  background: rgba(34, 230, 255, .09);
  color: #8fd8ea;
}

/* ═══════════ 响应式 ═══════════ */
@media (max-width: 620px) {
  body { padding: 20px 12px 30px; gap: 16px; }
  .panel { padding: 14px 15px; gap: 13px 16px; }
  .field { min-width: 100%; }
  .readout { min-width: auto; }
  .note { font-size: 11.5px; }
}

/* ═══════════ 无障碍：减少动效 ═══════════ */
@media (prefers-reduced-motion: reduce) {
  .stage * { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  .head h1 { animation: none; }
}
</style>
</head>

<body>

<header class="head">
  <h1>鹈鹕骑自行车</h1>
  <p>Pelican Riding a Bicycle · Pure SVG Animation</p>
</header>

<!-- ═══════════════════════════════════════════════════════
     舞台
     ═══════════════════════════════════════════════════════ -->
<div class="stage" id="stage">
<svg viewBox="0 0 800 450" role="img" aria-label="一只戴着头盔、围着围巾的鹈鹕骑着自行车在城市夜景中前行的循环动画">

  <defs>
    <!-- 天空渐变 -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="var(--sky-0)"/>
      <stop offset="55%"  stop-color="var(--sky-1)"/>
      <stop offset="100%" stop-color="var(--sky-2)"/>
    </linearGradient>

    <!-- 喙渐变 -->
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%"   stop-color="var(--beak-0)"/>
      <stop offset="100%" stop-color="var(--beak-1)"/>
    </linearGradient>

    <!-- 霓虹发光 -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 地面雾光 -->
    <linearGradient id="groundFog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(34,230,255,.16)"/>
      <stop offset="100%" stop-color="rgba(34,230,255,0)"/>
    </linearGradient>

    <!-- 城市剪影图案（400px 宽，复制两份实现无缝滚动） -->
    <g id="cityTile">
      <rect x="0"   y="296" width="34" height="64"/>
      <rect x="40"  y="262" width="26" height="98"/>
      <rect x="72"  y="280" width="40" height="80"/>
      <rect x="120" y="240" width="22" height="120"/>
      <rect x="148" y="272" width="36" height="88"/>
      <rect x="192" y="252" width="28" height="108"/>
      <rect x="228" y="288" width="44" height="72"/>
      <rect x="280" y="266" width="24" height="94"/>
      <rect x="310" y="244" width="38" height="116"/>
      <rect x="356" y="278" width="30" height="82"/>
      <!-- 亮着的窗 -->
      <rect class="city-window" x="46"  y="272" width="5" height="6"/>
      <rect class="city-window" x="46"  y="292" width="5" height="6"/>
      <rect class="city-window" x="126" y="252" width="5" height="6"/>
      <rect class="city-window" x="126" y="276" width="5" height="6"/>
      <rect class="city-window" x="198" y="266" width="5" height="6"/>
      <rect class="city-window" x="316" y="258" width="5" height="6"/>
      <rect class="city-window" x="316" y="284" width="5" height="6"/>
      <rect class="city-window" x="78"  y="292" width="5" height="6"/>
      <rect class="city-window" x="234" y="300" width="5" height="6"/>
    </g>
  </defs>

  <!-- ─────── 天空 ─────── -->
  <rect width="800" height="450" fill="url(#skyGrad)"/>

  <!-- 星空 -->
  <g>
    <circle class="star" cx="88"  cy="52"  r="1.6"/>
    <circle class="star" cx="186" cy="34"  r="1.1"/>
    <circle class="star" cx="272" cy="76"  r="1.4"/>
    <circle class="star" cx="360" cy="28"  r="1.2"/>
    <circle class="star" cx="448" cy="62"  r="1.7"/>
    <circle class="star" cx="540" cy="40"  r="1.1"/>
    <circle class="star" cx="628" cy="80"  r="1.3"/>
    <circle class="star" cx="712" cy="34"  r="1.5"/>
    <circle class="star" cx="764" cy="92"  r="1.1"/>
    <circle class="star" cx="34"  cy="112" r="1.2"/>
    <circle class="star" cx="596" cy="120" r="1.3"/>
  </g>

  <!-- 月亮 -->
  <g filter="url(#glow)" opacity=".85">
    <circle cx="668" cy="88" r="26" fill="rgba(200,240,255,.14)" stroke="var(--cyan)" stroke-width="2.5"/>
    <circle cx="676" cy="82" r="20" fill="var(--sky-0)" opacity=".9"/>
  </g>

  <!-- ─────── 云（缓慢视差）─────── -->
  <g class="cloud-band">
    <g class="cloud">
      <ellipse cx="120" cy="150" rx="56" ry="15"/>
      <ellipse cx="150" cy="142" rx="38" ry="17"/>
      <ellipse cx="430" cy="126" rx="64" ry="14"/>
      <ellipse cx="466" cy="118" rx="42" ry="16"/>
      <ellipse cx="720" cy="164" rx="52" ry="13"/>
      <ellipse cx="748" cy="156" rx="36" ry="15"/>
    </g>
    <g class="cloud" transform="translate(800,0)">
      <ellipse cx="120" cy="150" rx="56" ry="15"/>
      <ellipse cx="150" cy="142" rx="38" ry="17"/>
      <ellipse cx="430" cy="126" rx="64" ry="14"/>
      <ellipse cx="466" cy="118" rx="42" ry="16"/>
      <ellipse cx="720" cy="164" rx="52" ry="13"/>
      <ellipse cx="748" cy="156" rx="36" ry="15"/>
    </g>
  </g>

  <!-- ─────── 城市剪影（视差，慢速）─────── -->
  <g class="city-band">
    <use href="#cityTile" class="city"/>
    <use href="#cityTile" class="city" transform="translate(400,0)"/>
    <use href="#cityTile" class="city" transform="translate(800,0)"/>
  </g>

  <!-- ─────── 地面 ─────── -->
  <rect x="0" y="360" width="800" height="34" fill="url(#groundFog)"/>
  <line class="road"       x1="-60" y1="372" x2="860" y2="372"/>
  <line class="road-faint" x1="-60" y1="392" x2="860" y2="392"/>

  <!-- ─────── 速度线 ─────── -->
  <g class="speed-line">
    <line x1="700" y1="150" x2="760" y2="150"/>
    <line x1="716" y1="196" x2="792" y2="196"/>
    <line x1="692" y1="242" x2="746" y2="242"/>
    <line x1="724" y1="288" x2="804" y2="288"/>
  </g>

  <!-- ═══════════════════════════════════════════════════
       自行车
       ═══════════════════════════════════════════════════ -->

  <!-- 后轮 -->
  <circle class="tire" cx="300" cy="330" r="70"/>
  <g class="wheel-back rot">
    <line class="spoke" x1="300" y1="262" x2="300" y2="398"/>
    <line class="spoke" x1="232" y1="330" x2="368" y2="330"/>
    <line class="spoke" x1="252" y1="282" x2="348" y2="378"/>
    <line class="spoke" x1="348" y1="282" x2="252" y2="378"/>
    <line class="spoke" x1="266" y1="268" x2="334" y2="392"/>
    <line class="spoke" x1="334" y1="268" x2="266" y2="392"/>
  </g>
  <circle class="hub" cx="300" cy="330" r="7.5"/>

  <!-- 前轮 -->
  <circle class="tire" cx="560" cy="330" r="70"/>
  <g class="wheel-front rot">
    <line class="spoke" x1="560" y1="262" x2="560" y2="398"/>
    <line class="spoke" x1="492" y1="330" x2="628" y2="330"/>
    <line class="spoke" x1="512" y1="282" x2="608" y2="378"/>
    <line class="spoke" x1="608" y1="282" x2="512" y2="378"/>
    <line class="spoke" x1="526" y1="268" x2="594" y2="392"/>
    <line class="spoke" x1="594" y1="268" x2="526" y2="392"/>
  </g>
  <circle class="hub" cx="560" cy="330" r="7.5"/>

  <!-- 车架 -->
  <g class="stroke">
    <path d="M300 330 L430 330"/>          <!-- 后下叉 -->
    <path d="M300 330 L370 215"/>          <!-- 后上叉 -->
    <path d="M370 215 L430 330"/>          <!-- 座管 -->
    <path d="M370 215 L535 200"/>          <!-- 上管 -->
    <path d="M430 330 L535 200"/>          <!-- 下管 -->
    <path d="M535 200 L560 330"/>          <!-- 前叉 -->
    <path d="M535 200 L538 176"/>          <!-- 立管 -->
  </g>

  <!-- 齿盘 -->
  <circle class="chainring" cx="430" cy="330" r="26"/>

  <!-- 座垫 -->
  <ellipse class="fill-neon" cx="358" cy="204" rx="30" ry="10" transform="rotate(-9 358 204)"/>

  <!-- 车把 -->
  <path class="stroke" d="M538 176 L508 180"/>
  <path class="stroke" d="M538 176 L568 180"/>
  <circle class="hub" cx="508" cy="180" r="6.5"/>
  <circle class="hub" cx="568" cy="180" r="6.5"/>

  <!-- 曲柄 + 踏板 -->
  <g class="crank rot">

<!-- ═══════════════════════════════════════════════════════
     控制面板
     ═══════════════════════════════════════════════════════ -->
<div class="panel">
  <button class="btn" id="playBtn" type="button" aria-label="暂停或继续动画">
    <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor">
      <rect x="7" y="5" width="3.6" height="14" rx="1.4"/>
      <rect x="13.4" y="5" width="3.6" height="14" rx="1.4"/>
    </svg>
    <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor" style="display:none">
      <path d="M8 5.2v13.6L19 12z"/>
    </svg>
    <span id="playLabel">暂停</span>
  </button>

  <div class="field">
    <label for="speed">速度</label>
    <input type="range" id="speed" min="0.2" max="3" step="0.1" value="1"
           aria-label="动画速度倍率" />
  </div>

  <div class="readout">
    <b id="kmh">18</b><span>km/h</span>
  </div>

  <div class="readout" style="min-width:70px">
    <b id="mult">1.0</b><span>×</span>
  </div>
</div>

<p class="note">
  纯 <code>SVG</code> + <code>CSS</code> 手工绘制，零外部依赖 · 车轮 / 曲柄 / 双腿 / 身体 / 脖子 / 翅膀 / 围巾 / 眨眼 共 8 组独立动画
</p>

<script>
/* ══════════════════════════════════════════════════════
   速度控制：改 CSS 变量 --speed，所有动画同步变速
   ══════════════════════════════════════════════════════ */
(function () {
  var stage   = document.getElementById('stage');
  var root    = document.documentElement;
  var slider  = document.getElementById('speed');
  var kmhEl   = document.getElementById('kmh');
  var multEl  = document.getElementById('mult');
  var btn     = document.getElementById('playBtn');
  var lbl     = document.getElementById('playLabel');
  var icPause = document.getElementById('iconPause');
  var icPlay  = document.getElementById('iconPlay');

  var BASE_KMH = 18;                 // 1.0× 时的基准速度
  var paused = false;

  function apply(v) {
    root.style.setProperty('--speed', v);
    multEl.textContent = v.toFixed(1);
    kmhEl.textContent = Math.round(BASE_KMH * v);
  }

  slider.addEventListener('input', function () {
    apply(parseFloat(slider.value));
  });

  btn.addEventListener('click', function () {
    paused = !paused;
    stage.classList.toggle('is-paused', paused);
    lbl.textContent = paused ? '播放' : '暂停';
    icPause.style.display = paused ? 'none' : 'block';
    icPlay.style.display  = paused ? 'block' : 'none';
  });

  // 空格键快捷暂停
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
      e.preventDefault();
      btn.click();
    }
  });

  apply(1);

  /* 尊重系统的「减少动效」设置 */
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    paused = true;
    stage.classList.add('is-paused');
    lbl.textContent = '播放';
    icPause.style.display = 'none';
    icPlay.style.display  = 'block';
  }
})();
</script>

</body>
</html>
