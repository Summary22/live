<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · 暖色日落版</title>
<meta name="description" content="纯 SVG + CSS 手工绘制的鹈鹕骑自行车 2D 循环动画 · 暖色调日落场景" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌅</text></svg>" />

<style>
/* ═══════════════════════════════════════════════════════════
   暖色调令牌 —— 全部取色自日落光谱
   ═══════════════════════════════════════════════════════════ */
:root {
  /* 天空（自下而上：暖橙 → 橙红 → 玫红 → 暖紫） */
  --sky-0:    #f4b171;
  --sky-1:    #e8825a;
  --sky-2:    #b8494f;
  --sky-3:    #6d2b46;
  --sky-4:    #3a1c3d;

  --sun-core: #fff0c4;
  --sun-glow: rgba(255, 214, 130, .55);
  --sun-halo: rgba(255, 168, 92, .28);

  --cloud:    rgba(255, 186, 148, .38);
  --cloud-hi: rgba(255, 224, 190, .5);

  --hill-far: #7d4157;
  --hill-mid: #5c2f45;
  --hill-near:#3f2033;

  --ground:   #2e1a2a;
  --road:     rgba(255, 196, 130, .5);

  /* 鹈鹕 */
  --cream:    #fdf2df;
  --cream-2:  #f6e2c6;
  --beak-0:   #ffc061;
  --beak-1:   #ff7c33;
  --pouch:    rgba(255, 156, 104, .72);
  --scarf:    #e8503a;
  --helmet:   #ff9243;

  /* 自行车（铜色） */
  --bike:     #c07247;
  --bike-2:   #95502f;

  /* 描边统一用深暖棕，比纯黑柔和 */
  --ink:      #4a2823;
  --ink-soft: rgba(74, 40, 35, .55);

  --speed:  1;
  --cycle:  1.6s;

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  padding: 32px 18px 40px;
  font-family: var(--sans);
  color: #f6e4d4;
  background:
    radial-gradient(ellipse 70% 50% at 50% -8%, rgba(255, 168, 92, .18), transparent 68%),
    radial-gradient(ellipse 60% 45% at 88% 108%, rgba(232, 80, 58, .14), transparent 70%),
    #1a1016;
  -webkit-font-smoothing: antialiased;
}

/* ═══════════ 标题 ═══════════ */
.head { text-align: center; }

.head h1 {
  font-size: clamp(20px, 3.8vw, 29px);
  font-weight: 800;
  letter-spacing: -.01em;
  background: linear-gradient(100deg, #fff3dd 4%, #ffc061 36%, #ff8c42 64%, #e8503a 94%);
  -webkit-background-clip: text;
          background-clip: text;
  -webkit-text-fill-color: transparent;
  background-size: 220% 100%;
  animation: hueSlide 9s ease-in-out infinite alternate;
}
@keyframes hueSlide {
  from { background-position: 0% 50%; }
  to   { background-position: 100% 50%; }
}

.head p {
  margin-top: 8px;
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: #a8766a;
}

/* ═══════════ 舞台 ═══════════ */
.stage {
  position: relative;
  width: 100%;
  max-width: 860px;
  border-radius: 22px;
  overflow: hidden;
  border: 1px solid rgba(255, 180, 120, .22);
  box-shadow:
    0 30px 80px -34px rgba(255, 140, 66, .5),
    0 0 0 1px rgba(255, 230, 200, .05) inset;
  line-height: 0;
  background: var(--sky-4);
}

.stage svg { display: block; width: 100%; height: auto; }

/* ═══════════ SVG 元素样式 ═══════════ */
.stroke      { fill: none; stroke: var(--bike); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.stroke-thin { fill: none; stroke: var(--bike-2); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.tire        { fill: none; stroke: var(--bike-2); stroke-width: 8; }
.spoke       { stroke: rgba(255, 196, 130, .55); stroke-width: 3; stroke-linecap: round; }
.hub         { fill: var(--bike); }
.hub-light   { fill: var(--beak-0); }
.chainring   { fill: none; stroke: var(--bike); stroke-width: 4.5; }
.seat        { fill: var(--bike-2); stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; }

.body        { fill: var(--cream); stroke: var(--ink); stroke-width: 6.5; stroke-linejoin: round; }
.body-shade  { fill: var(--cream-2); stroke: none; opacity: .92; }
.neck        { fill: none; stroke: var(--ink); stroke-width: 22; stroke-linecap: round; }
.neck-fill   { fill: none; stroke: var(--cream); stroke-width: 15; stroke-linecap: round; }
.beak        { fill: url(#beakGrad); stroke: var(--ink); stroke-width: 5; stroke-linejoin: round; }
.pouch       { fill: var(--pouch); stroke: var(--ink); stroke-width: 4.5; stroke-linejoin: round; }
.eye         { fill: var(--ink); }
.glint       { fill: #fff8ec; }
.leg         { fill: none; stroke: var(--ink); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
.leg-inner   { fill: none; stroke: var(--cream-2); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.leg-far     { opacity: .55; }

.helmet      { fill: var(--helmet); stroke: var(--ink); stroke-width: 4.5; stroke-linejoin: round; }
.helmet-strap{ fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.scarf       { fill: none; stroke: var(--scarf); stroke-width: 13; stroke-linecap: round; }
.scarf-tip   { fill: var(--scarf); stroke: var(--ink); stroke-width: 3.5; stroke-linejoin: round; }

.wing        { fill: var(--cream-2); stroke: var(--ink); stroke-width: 6; stroke-linejoin: round; }
.wing-line   { fill: none; stroke: var(--ink-soft); stroke-width: 3; stroke-linecap: round; }

.road        { stroke: var(--road); stroke-width: 5; stroke-dasharray: 34 26; }
.road-faint  { stroke: rgba(255, 196, 130, .22); stroke-width: 3; stroke-dasharray: 16 40; }
.cloud       { fill: var(--cloud); }
.cloud-hi    { fill: var(--cloud-hi); }
.hill-far    { fill: var(--hill-far); }
.hill-mid    { fill: var(--hill-mid); }
.hill-near   { fill: var(--hill-near); }
.bird        { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; opacity: .5; }
.grass       { fill: none; stroke: var(--hill-near); stroke-width: 3; stroke-linecap: round; opacity: .55; }

/* ═══════════════════════════════════════════════════════════
   动画（与速度变量联动）
   ═══════════════════════════════════════════════════════════ */
.rot { transform-box: view-box; }

.wheel-back  { transform-origin: 300px 330px; animation: spin calc(var(--cycle) / 2.6 / var(--speed)) linear infinite; }
.wheel-front { transform-origin: 560px 330px; animation: spin calc(var(--cycle) / 2.6 / var(--speed)) linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.crank { transform-origin: 430px 330px; animation: spin calc(var(--cycle) / var(--speed)) linear infinite; }

.rider { transform-box: view-box; transform-origin: 430px 400px; animation: bob calc(var(--cycle) / var(--speed)) ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3.5px); }
}

.head-group { transform-box: view-box; transform-origin: 420px 150px; animation: nod calc(var(--cycle) * 2 / var(--speed)) ease-in-out infinite; }
@keyframes nod {
  0%, 100% { transform: rotate(0deg); }
  50%      { transform: rotate(3.6deg); }
}

.wing { transform-box: view-box; transform-origin: 300px 150px; animation: flap calc(var(--cycle) * 1.6 / var(--speed)) ease-in-out infinite; }
@keyframes flap {
  0%, 100% { transform: rotate(0deg) scaleY(1); }
  50%      { transform: rotate(-10deg) scaleY(.9); }
}

.leg-front { transform-box: view-box; transform-origin: 318px 208px; animation: pedalA calc(var(--cycle) / var(--speed)) linear infinite; }
.leg-back  { transform-box: view-box; transform-origin: 312px 208px; animation: pedalB calc(var(--cycle) / var(--speed)) linear infinite; }
@keyframes pedalA { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(7deg); } }
@keyframes pedalB { 0%, 100% { transform: rotate(7deg); }  50% { transform: rotate(-6deg); } }

.scarf-group { transform-box: view-box; transform-origin: 400px 118px; animation: scarfWave calc(var(--cycle) * .9 / var(--speed)) ease-in-out infinite; }
@keyframes scarfWave {
  0%, 100% { transform: rotate(-3.5deg) skewY(0deg); }
  50%      { transform: rotate(3.5deg) skewY(3deg); }
}

.eyelid { transform-box: view-box; transform-origin: 468px 82px; animation: blinkEye 4.8s ease-in-out infinite; }
@keyframes blinkEye {
  0%, 92%, 100% { transform: scaleY(1); }
  95%           { transform: scaleY(.08); }
}

.road       { animation: dash calc(.75s / var(--speed)) linear infinite; }
.road-faint { animation: dash calc(1.5s / var(--speed)) linear infinite; }
@keyframes dash { to { stroke-dashoffset: -60; } }

/* 太阳脉动光晕 */
.sun-halo { animation: sunPulse calc(5s / var(--speed)) ease-in-out infinite; transform-box: view-box; transform-origin: 646px 246px; }
@keyframes sunPulse {
  0%, 100% { opacity: .55; transform: scale(1); }
  50%      { opacity: .82; transform: scale(1.055); }
}

/* 云层飘移 */
.cloud-near { animation: drift calc(44s / var(--speed)) linear infinite; }
.cloud-far  { animation: drift calc(72s / var(--speed)) linear infinite; }
@keyframes drift { to { transform: translateX(-800px); } }

/* 飞鸟 */
.bird { animation: flapWing 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.bird:nth-child(2) { animation-delay: .5s; }
.bird:nth-child(3) { animation-delay: 1.1s; }
@keyframes flapWing {
  0%, 100% { transform: scaleY(1); }
  50%      { transform: scaleY(.55); }
}

/* 光晕呼吸 */
.glow-breath { animation: breathe calc(6s / var(--speed)) ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }

.stage.is-paused * { animation-play-state: paused !important; }

/* ═══════════ 控制面板 ═══════════ */
.panel {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px 22px;
  width: 100%;
  max-width: 860px;
  padding: 16px 20px;
  border-radius: 16px;
  border: 1px solid rgba(255, 180, 120, .18);
  background: linear-gradient(158deg, rgba(58, 30, 40, .78), rgba(28, 16, 24, .9));
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 17px;
  border: 1px solid rgba(255, 180, 120, .3);
  border-radius: 10px;
  background: rgba(255, 170, 110, .09);
  color: #f6e4d4;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all .22s ease;
}
.btn:hover {
  border-color: rgba(255, 150, 80, .72);
  color: #ffc061;
  background: rgba(255, 170, 110, .16);
}
.btn svg { width: 15px; height: 15px; }

.field { display: flex; align-items: center; gap: 11px; flex: 1; min-width: 210px; }
.field label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #a8766a;
  white-space: nowrap;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  height: 4px;
  border-radius: 999px;
  background: linear-gradient(90deg, #ffd166, #ff7c33, #e8503a);
  outline: none;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 17px; height: 17px;
  border-radius: 50%;
  background: #fff3dd;
  border: 2px solid #ff8c42;
  box-shadow: 0 0 14px rgba(255, 150, 80, .95);
  cursor: grab;
}
input[type="range"]::-moz-range-thumb {
  width: 15px; height: 15px;
  border-radius: 50%;
  background: #fff3dd;
  border: 2px solid #ff8c42;
  box-shadow: 0 0 14px rgba(255, 150, 80, .95);
  cursor: grab;
}

.readout {
  display: flex; align-items: baseline; gap: 5px;
  font-family: var(--mono); font-size: 13px; color: #ffb35c;
  min-width: 92px;
}
.readout b { font-size: 19px; font-weight: 700; }
.readout span { font-size: 11px; color: #a8766a; }

.note {
  width: 100%; max-width: 860px;
  font-size: 12.5px; line-height: 1.8; color: #a8766a;
  text-align: center;
}
.note code {
  font-family: var(--mono); font-size: 11.5px;
  padding: 2px 6px; border-radius: 5px;
  background: rgba(255, 170, 110, .14); color: #ffc061;
}

/* ═══════════ 响应式 ═══════════ */
@media (max-width: 620px) {
  body { padding: 20px 12px 30px; gap: 16px; }
  .panel { padding: 14px 15px; gap: 13px 16px; }
  .field { min-width: 100%; }
  .readout { min-width: auto; }
  .note { font-size: 11.5px; }
}

@media (prefers-reduced-motion: reduce) {
  .stage * { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  .head h1 { animation: none; }
}
</style>
</head>

<body>

<header class="head">
  <h1>鹈鹕骑自行车</h1>
  <p>Pelican Riding a Bicycle · Warm Sunset Edition</p>
</header>

<div class="stage" id="stage">
<svg viewBox="0 0 800 450" role="img" aria-label="日落时分，一只戴头盔围围巾的鹈鹕骑着自行车在丘陵间前行的暖色调循环动画">

  <defs>
    <!-- 日落天空：自下而上 暖橙 → 橙红 → 玫红 → 暖紫 -->
    <linearGradient id="skyGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#f7bd7a"/>
      <stop offset="22%"  stop-color="#ee9060"/>
      <stop offset="46%"  stop-color="#cf5f56"/>
      <stop offset="70%"  stop-color="#94405a"/>
      <stop offset="100%" stop-color="#4a2148"/>
    </linearGradient>

    <!-- 落日核心 -->
    <radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#fffaf0"/>
      <stop offset="38%"  stop-color="#ffe9ac"/>
      <stop offset="72%"  stop-color="#ffc46a"/>
      <stop offset="100%" stop-color="#ff9c4a"/>
    </radialGradient>

    <!-- 落日外层光晕 -->
    <radialGradient id="haloGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="rgba(255,214,140,.5)"/>
      <stop offset="55%"  stop-color="rgba(255,168,92,.2)"/>
      <stop offset="100%" stop-color="rgba(255,140,66,0)"/>
    </radialGradient>

    <!-- 鸟喙渐变 -->
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%"   stop-color="#ffd27a"/>
      <stop offset="55%"  stop-color="#ffa845"/>
      <stop offset="100%" stop-color="#f4712a"/>
    </linearGradient>

    <!-- 地面暖光 -->
    <linearGradient id="groundFog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,170,100,.2)"/>
      <stop offset="100%" stop-color="rgba(255,170,100,0)"/>
    </linearGradient>

    <!-- 光晕滤镜 -->
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- ═══════ 天空 ═══════ -->
  <rect width="800" height="450" fill="url(#skyGrad)"/>

  <!-- ═══════ 落日 ═══════ -->
  <g>
    <!-- 外层大光晕 -->
    <circle class="sun-halo" cx="646" cy="246" r="150" fill="url(#haloGrad)"/>
    <!-- 中层暖晕（glow-breath 提供呼吸感） -->
    <circle class="glow-breath" cx="646" cy="246" r="82" fill="url(#haloGrad)" opacity=".85"/>
    <!-- 日轮本体 -->
    <circle cx="646" cy="246" r="52" fill="url(#sunGrad)"/>
    <!-- 日轮上缘高光 -->
    <circle cx="646" cy="228" r="40" fill="#fff6dd" opacity=".35" filter="url(#softGlow)"/>
  </g>

  <!-- ═══════ 云层（双层视差） ═══════ -->
  <g class="cloud-far" opacity=".62">
    <g>
      <ellipse class="cloud" cx="140" cy="118" rx="86" ry="15"/>
      <ellipse class="cloud-hi" cx="176" cy="110" rx="52" ry="13"/>
      <ellipse class="cloud" cx="474" cy="96" rx="94" ry="14"/>
      <ellipse class="cloud-hi" cx="512" cy="88" rx="58" ry="12"/>
      <ellipse class="cloud" cx="726" cy="146" rx="76" ry="13"/>
    </g>
    <g transform="translate(800,0)">
      <ellipse class="cloud" cx="140" cy="118" rx="86" ry="15"/>
      <ellipse class="cloud-hi" cx="176" cy="110" rx="52" ry="13"/>
      <ellipse class="cloud" cx="474" cy="96" rx="94" ry="14"/>
      <ellipse class="cloud-hi" cx="512" cy="88" rx="58" ry="12"/>
      <ellipse class="cloud" cx="726" cy="146" rx="76" ry="13"/>
    </g>
  </g>

  <g class="cloud-near">
    <g>
      <ellipse class="cloud" cx="248" cy="182" rx="104" ry="16"/>
      <ellipse class="cloud-hi" cx="292" cy="173" rx="62" ry="13"/>
      <ellipse class="cloud" cx="646" cy="162" rx="112" ry="15"/>
      <ellipse class="cloud-hi" cx="694" cy="154" rx="66" ry="12"/>
    </g>
    <g transform="translate(800,0)">
      <ellipse class="cloud" cx="248" cy="182" rx="104" ry="16"/>
      <ellipse class="cloud-hi" cx="292" cy="173" rx="62" ry="13"/>
      <ellipse class="cloud" cx="646" cy="162" rx="112" ry="15"/>
      <ellipse class="cloud-hi" cx="694" cy="154" rx="66" ry="12"/>
    </g>
  </g>

  <!-- ═══════ 归鸟 ═══════ -->
  <g>
    <path class="bird" d="M148 96 q10 -8 20 0 q10 -8 20 0"/>
    <path class="bird" d="M206 78 q8 -6 16 0 q8 -6 16 0"/>
    <path class="bird" d="M118 128 q7 -5 14 0 q7 -5 14 0"/>
  </g>

  <!-- ═══════ 远山（三层剪影，越近越深） ═══════ -->
  <path class="hill-far"  d="M0 330 L88 276 L168 318 L256 264 L348 312 L438 270 L534 316 L628 272 L724 314 L800 282 L800 360 L0 360 Z"/>
  <path class="hill-mid"  d="M0 348 L96 306 L186 340 L280 298 L378 338 L470 302 L568 342 L664 308 L760 344 L800 330 L800 372 L0 372 Z"/>
  <path class="hill-near" d="M0 366 L74 340 L166 362 L262 336 L354 360 L452 338 L548 362 L648 340 L742 364 L800 352 L800 392 L0 392 Z"/>

  <!-- ═══════ 地面 ═══════ -->
  <rect x="0" y="368" width="800" height="40" fill="url(#groundFog)"/>
  <line class="road"       x1="-60" y1="378" x2="860" y2="378"/>
  <line class="road-faint" x1="-60" y1="398" x2="860" y2="398"/>

  <!-- 路边草丛（静止，做纵深参考） -->
  <g class="grass">
    <path d="M42 378 q3 -12 1 -16 M46 378 q5 -10 9 -13 M52 378 q-3 -9 -7 -12"/>
    <path d="M742 378 q3 -12 1 -16 M746 378 q5 -10 9 -13"/>
  </g>

  <!-- ═══════ 自行车（铜色） ═══════ -->
  <g>
    <!-- 后轮 -->
    <circle class="tire" cx="300" cy="330" r="70"/>
    <g class="wheel-back rot">
      <line class="spoke" x1="300" y1="262" x2="300" y2="398"/>
      <line class="spoke" x1="232" y1="330" x2="368" y2="330"/>
      <line class="spoke" x1="252" y1="282" x2="348" y2="378"/>
      <line class="spoke" x1="348" y1="282" x2="252" y2="378"/>
      <line class="spoke" x1="266" y1="268" x2="334" y2="392"/>
      <line class="spoke" x1="334" y1="268" x2="266" y2="392"/>
    </g>
    <circle class="hub" cx="300" cy="330" r="7.5"/>

    <!-- 前轮 -->
    <circle class="tire" cx="560" cy="330" r="70"/>
    <g class="wheel-front rot">
      <line class="spoke" x1="560" y1="262" x2="560" y2="398"/>
      <line class="spoke" x1="492" y1="330" x2="628" y2="330"/>
      <line class="spoke" x1="512" y1="282" x2="608" y2="378"/>
      <line class="spoke" x1="608" y1="282" x2="512" y2="378"/>
      <line class="spoke" x1="526" y1="268" x2="594" y2="392"/>
      <line class="spoke" x1="594" y1="268" x2="526" y2="392"/>
    </g>
    <circle class="hub" cx="560" cy="330" r="7.5"/>

    <!-- 车架 -->
    <g class="stroke">
      <path d="M300 330 L430 330"/>
      <path d="M300 330 L370 215"/>
      <path d="M370 215 L430 330"/>
      <path d="M370 215 L535 200"/>
      <path d="M430 330 L535 200"/>
      <path d="M535 200 L560 330"/>
      <path d="M535 200 L538 176"/>
    </g>

    <!-- 齿盘 -->
    <circle class="chainring" cx="430" cy="330" r="26"/>

    <!-- 座垫 -->
    <ellipse class="seat" cx="358" cy="204" rx="30" ry="10" transform="rotate(-9 358 204)"/>

    <!-- 车把 -->
    <path class="stroke" d="M538 176 L508 180"/>
    <path class="stroke" d="M538 176 L568 180"/>
    <circle class="hub-light" cx="508" cy="180" r="6.5"/>
    <circle class="hub-light" cx="568" cy="180" r="6.5"/>

    <!-- 曲柄 + 踏板 -->
    <g class="crank rot">
      <line class="stroke" x1="430" y1="292" x2="430" y2="368"/>
      <rect class="hub-light" x="413" y="286" width="34" height="11" rx="5"/>
      <rect class="hub-light" x="413" y="363" width="34" height="11" rx="5"/>
    </g>
  </g>

  <!-- ═══════ 鹈鹕 ═══════ -->
  <g class="rider">

    <!-- 远侧腿（leg-far 提供半透明景深） -->
    <g class="leg-back leg-far">
      <path class="leg"       d="M312 208 L372 268 L432 362"/>
      <path class="leg-inner" d="M312 208 L372 268 L432 362"/>
    </g>

    <!-- 身体（腹部叠一层稍深的暖白，做出体积感） -->
    <ellipse class="body" cx="300" cy="165" rx="68" ry="46" transform="rotate(-14 300 165)"/>
    <ellipse class="body-shade" cx="294" cy="181" rx="45" ry="24" transform="rotate(-14 294 181)"/>

    <!-- 围巾（飘在身后，暖红） -->
    <g class="scarf-group">
      <path class="scarf" d="M352 132 C300 142, 246 150, 196 138"/>
      <path class="scarf" d="M352 140 C306 156, 252 168, 206 162" opacity=".5"/>
      <path class="scarf-tip" d="M196 138 L168 124 L186 146 L164 151 L196 153 Z"/>
    </g>

    <!-- 脖子 · 头 · 喙 -->
    <g class="head-group">
      <path class="neck"      d="M340 150 Q400 118 448 100"/>
      <path class="neck-fill" d="M340 150 Q400 118 448 100"/>

      <ellipse class="body" cx="462" cy="92" rx="27" ry="23"/>

      <!-- 喉囊 -->
      <path class="pouch" d="M487 100 Q540 110 598 98 Q572 152 520 148 Q490 136 487 100 Z"/>
      <!-- 上喙 -->
      <path class="beak" d="M484 78 Q546 82 604 98 Q546 96 484 100 Z"/>
      <!-- 喙上的鼻孔线 -->
      <path class="stroke-thin" d="M498 84 Q518 85 534 89" opacity=".5"/>

      <!-- 眼睛 -->
      <circle class="eye" cx="468" cy="82" r="6"/>
      <circle class="glint" cx="470" cy="79.5" r="2.2"/>
      <ellipse class="eyelid eye" cx="468" cy="82" rx="6.4" ry="6"/>

      <!-- 头盔（暖橙） -->
      <path class="helmet" d="M436 84 A27 27 0 0 1 490 84 Q463 70 436 84 Z"/>
      <path class="helmet-strap" d="M436 84 L492 84"/>
      <path class="helmet-strap" d="M462 60 L462 84"/>
      <path class="helmet" d="M486 82 L508 88 L486 92 Z"/>
    </g>

    <!-- 翅膀 -->
    <g class="wing">
      <path class="wing" d="M268 128 Q320 112 348 152 Q322 192 264 184 Q244 156 268 128 Z"/>
      <path class="wing-line" d="M282 146 Q306 142 330 158"/>
      <path class="wing-line" d="M278 162 Q302 160 322 172"/>
    </g>

    <!-- 近侧腿 -->
    <g class="leg-front">
      <path class="leg"       d="M318 208 L378 258 L428 290"/>
      <path class="leg-inner" d="M318 208 L378 258 L428 290"/>
    </g>

  </g>

</svg>
</div>

<div class="panel">
  <button class="btn" id="playBtn" type="button" aria-label="暂停或继续动画">
    <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor">
      <rect x="7" y="5" width="3.6" height="14" rx="1.4"/>
      <rect x="13.4" y="5" width="3.6" height="14" rx="1.4"/>
    </svg>
    <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor" style="display:none">
      <path d="M8 5.2v13.6L19 12z"/>
    </svg>
    <span id="playLabel">暂停</span>
  </button>

  <div class="field">
    <label for="speed">速度</label>
    <input type="range" id="speed" min="0.2" max="3" step="0.1" value="1"
           aria-label="动画速度倍率" />
  </div>

  <div class="readout">
    <b id="kmh">18</b><span>km/h</span>
  </div>

  <div class="readout" style="min-width:70px">
    <b id="mult">1.0</b><span>×</span>
  </div>
</div>

<p class="note">
  纯 <code>SVG</code> + <code>CSS</code> 绘制，零外部依赖 · 暖色日落场景 · 10 组动画（车轮 / 曲柄 / 双腿 / 身体 / 脖子 / 翅膀 / 围巾 / 眨眼 / 飞鸟 / 云层）
</p>

<script>
(function () {
  var stage   = document.getElementById('stage');
  var root    = document.documentElement;
  var slider  = document.getElementById('speed');
  var kmhEl   = document.getElementById('kmh');
  var multEl  = document.getElementById('mult');
  var btn     = document.getElementById('playBtn');
  var lbl     = document.getElementById('playLabel');
  var icPause = document.getElementById('iconPause');
  var icPlay  = document.getElementById('iconPlay');

  var BASE_KMH = 18;
  var paused = false;

  function apply(v) {
    root.style.setProperty('--speed', v);
    multEl.textContent = v.toFixed(1);
    kmhEl.textContent = Math.round(BASE_KMH * v);
  }

  slider.addEventListener('input', function () {
    apply(parseFloat(slider.value));
  });

  btn.addEventListener('click', function () {
    paused = !paused;
    stage.classList.toggle('is-paused', paused);
    lbl.textContent = paused ? '播放' : '暂停';
    icPause.style.display = paused ? 'none' : 'block';
    icPlay.style.display  = paused ? 'block' : 'none';
  });

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
      e.preventDefault();
      btn.click();
    }
  });

  apply(1);

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    paused = true;
    stage.classList.add('is-paused');
    lbl.textContent = '播放';
    icPause.style.display = 'none';
    icPlay.style.display  = 'block';
  }
})();
</script>

</body>
</html>
